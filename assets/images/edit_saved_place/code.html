<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Edit Saved Place</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1a2c20",
                        "input-light": "#e7f3eb",
                        "input-dark": "#1e3325",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body { font-family: "Plus Jakarta Sans", sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-[#0d1b12] dark:text-gray-100 flex flex-col min-h-screen overflow-x-hidden">
<!-- Header -->
<div class="sticky top-0 z-50 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-sm border-b border-gray-100 dark:border-gray-800">
<div class="flex items-center p-4 h-16 justify-between">
<button aria-label="Go back" class="flex items-center justify-center size-10 rounded-full hover:bg-gray-100 dark:hover:bg-white/10 transition-colors text-[#0d1b12] dark:text-white">
<span class="material-symbols-outlined text-xl">arrow_back_ios_new</span>
</button>
<h2 class="text-[#0d1b12] dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-10">Edit Saved Place</h2>
</div>
</div>
<!-- Main Content -->
<main class="flex-1 w-full max-w-md mx-auto flex flex-col">
<!-- Map Section -->
<div class="px-4 py-2">
<div class="relative w-full aspect-[16/10] rounded-xl overflow-hidden shadow-sm">
<div class="absolute inset-0 bg-cover bg-center" data-alt="Map showing street view with a green location pin centered" data-location="New York City" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCS0cUMabDWPsVNxJ5ekUWqJWyVX0boWNvbDB1owrIGnQ-RmV-1s278b5cAjdVTDELyLagcZhkbRAWEzJKfKefiOfjSGwVin38XxKntKcJiYqLw2A-DqYoMvM65K9vEJ38yC32EsRTvpNNcgae0urki9Ratoz3Tu82O1Xa_anmq25YcHBFa5jzoax31S6eOd0hEqFlpgcUu0B40HyY1BdLSZgD9-TBCZkRAUEOdq63nf87jyOnnxVtMc5dhz9D4pRo6ZULRNXVOzaM");'>
</div>
<!-- Interactive Pin Overlay -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="relative -mt-8 flex flex-col items-center">
<span class="material-symbols-outlined text-primary text-5xl drop-shadow-md" style="font-variation-settings: 'FILL' 1;">location_on</span>
<div class="w-3 h-1.5 bg-black/20 rounded-[100%] blur-[2px]"></div>
</div>
</div>
<!-- Map Controls (Cosmetic) -->
<div class="absolute bottom-3 right-3 flex flex-col gap-2">
<button class="size-10 bg-white dark:bg-surface-dark rounded-full shadow-lg flex items-center justify-center text-gray-600 dark:text-gray-300">
<span class="material-symbols-outlined text-xl">my_location</span>
</button>
</div>
</div>
</div>
<!-- Form Fields -->
<div class="flex flex-col gap-6 px-4 py-6">
<!-- Address Field -->
<label class="flex flex-col gap-2 group">
<p class="text-[#0d1b12] dark:text-gray-300 text-sm font-medium pl-1">Address</p>
<div class="relative flex items-center">
<span class="absolute left-4 text-gray-500 dark:text-gray-400 material-symbols-outlined">search</span>
<input class="w-full h-14 pl-12 pr-4 bg-input-light dark:bg-input-dark border-none rounded-xl text-[#0d1b12] dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:ring-2 focus:ring-primary/50 transition-all font-medium" placeholder="Search address" type="text" value="123 Green Street, New York, NY"/>
</div>
</label>
<!-- Name Field -->
<label class="flex flex-col gap-2 group">
<p class="text-[#0d1b12] dark:text-gray-300 text-sm font-medium pl-1">Name</p>
<div class="relative flex items-center">
<span class="absolute left-4 text-gray-500 dark:text-gray-400 material-symbols-outlined">bookmark</span>
<input class="w-full h-14 pl-12 pr-4 bg-input-light dark:bg-input-dark border-none rounded-xl text-[#0d1b12] dark:text-white placeholder-gray-500 dark:placeholder-gray-400 focus:ring-2 focus:ring-primary/50 transition-all font-medium" placeholder="e.g. Work, Gym" type="text" value="Home"/>
</div>
</label>
</div>
<!-- Spacer to push buttons to bottom on taller screens -->
<div class="flex-1"></div>
<!-- Actions -->
<div class="flex flex-col gap-3 px-4 py-6 mt-auto">
<!-- Update Button -->
<button class="w-full h-14 bg-primary hover:bg-green-400 active:scale-[0.98] transition-all rounded-xl flex items-center justify-center shadow-sm shadow-green-500/20">
<span class="text-[#0d1b12] text-base font-bold tracking-wide">Update Place</span>
</button>
<!-- Delete Button -->
<button class="w-full h-12 bg-transparent hover:bg-red-50 dark:hover:bg-red-900/10 active:scale-[0.98] transition-all rounded-xl flex items-center justify-center group">
<span class="material-symbols-outlined text-red-500 mr-2 text-xl group-hover:scale-110 transition-transform">delete</span>
<span class="text-red-500 text-base font-semibold">Delete place</span>
</button>
</div>
</main>
</body></html>
