<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>InDrive Home Screen</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "3xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Hide scrollbar for clean horizontal scrolling */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-[#0d1b12] dark:text-white font-display overflow-hidden h-screen w-full relative select-none">
<!-- Map Background Layer -->
<div class="absolute inset-0 z-0 h-full w-full">
<!-- Interactive Map Simulation -->
<div class="relative h-full w-full bg-gray-200 dark:bg-gray-800 bg-cover bg-center" data-alt="Overhead view of city streets map in light mode" data-location="New York City" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDSF9nz-JPJZNr-lOoyZaxStsO1U3Mn09UT9lzlcP4tHVF9FW37AaO7mOjm37dUKhI04lUkro8qjTl_lCrgE55jzazUCpHzDc1CYC5XZyAzX3aP0xN0fybZPl0toXar5wniAldx1wHNmW_qZ2rcPeK4m6GGVeffAo1zs1H7_flkIb8r8ghbi_Pyer-t7Fw9dm9HjiOLZHT2Kke07EJfcBSac8ukR0V34dx0yXJE_qxm7lDIKfLvt0dt7OjRogmvZx81fg3-EAXWLP0");'>
<!-- Map Overlay Gradient for better text readability at top -->
<div class="absolute inset-x-0 top-0 h-32 bg-gradient-to-b from-white/60 to-transparent dark:from-black/60 pointer-events-none"></div>
<!-- Simulated Map Elements (User Location & Cars) -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 flex flex-col items-center justify-center">
<!-- Radar effect -->
<div class="absolute w-32 h-32 bg-primary/20 rounded-full animate-ping opacity-75"></div>
<!-- User dot -->
<div class="h-6 w-6 bg-white rounded-full border-4 border-blue-500 shadow-lg z-10 relative"></div>
</div>
<!-- Nearby Car 1 -->
<div class="absolute top-[40%] left-[30%] p-1.5 bg-white dark:bg-gray-800 rounded-full shadow-md transform rotate-45">
<span class="material-symbols-outlined text-black dark:text-white text-[16px]">directions_car</span>
</div>
<!-- Nearby Car 2 -->
<div class="absolute top-[60%] right-[25%] p-1.5 bg-white dark:bg-gray-800 rounded-full shadow-md transform -rotate-12">
<span class="material-symbols-outlined text-black dark:text-white text-[16px]">local_taxi</span>
</div>
</div>
</div>
<!-- Top Navigation Layer -->
<div class="absolute top-0 left-0 right-0 z-10 flex justify-between items-start p-4 pt-12 safe-top">
<!-- Menu Button -->
<button class="flex items-center justify-center h-12 w-12 rounded-full bg-white dark:bg-background-dark shadow-[0_4px_12px_rgba(0,0,0,0.08)] hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-[#0d1b12] dark:text-white" style="font-size: 28px;">menu</span>
</button>
<!-- Profile/Shield Button -->
<button class="flex items-center justify-center h-12 w-12 rounded-full bg-white dark:bg-background-dark shadow-[0_4px_12px_rgba(0,0,0,0.08)] hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-[#0d1b12] dark:text-white" style="font-size: 24px;">security</span>
</button>
</div>
<!-- Map Controls (Right Side) -->
<div class="absolute right-4 bottom-[400px] z-10 flex flex-col gap-3">
<button class="flex items-center justify-center h-12 w-12 rounded-full bg-white dark:bg-background-dark shadow-[0_4px_12px_rgba(0,0,0,0.1)] hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
<span class="material-symbols-outlined text-[#0d1b12] dark:text-white text-[24px]">add</span>
</button>
<button class="flex items-center justify-center h-12 w-12 rounded-full bg-white dark:bg-background-dark shadow-[0_4px_12px_rgba(0,0,0,0.1)] hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
<span class="material-symbols-outlined text-[#0d1b12] dark:text-white text-[24px]">remove</span>
</button>
<button class="flex items-center justify-center h-12 w-12 rounded-full bg-white dark:bg-background-dark shadow-[0_4px_12px_rgba(0,0,0,0.1)] mt-2 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
<span class="material-symbols-outlined text-primary text-[24px]">my_location</span>
</button>
</div>
<!-- Bottom Sheet (Interaction Area) -->
<div class="absolute bottom-0 left-0 right-0 z-20 bg-background-light dark:bg-background-dark rounded-t-[32px] shadow-[0_-8px_30px_rgba(0,0,0,0.12)] flex flex-col max-h-[85vh] transition-all duration-300">
<!-- Drag Handle -->
<div class="w-full flex justify-center pt-3 pb-1">
<div class="w-12 h-1.5 bg-gray-300 dark:bg-gray-600 rounded-full"></div>
</div>
<!-- Service Selector (Horizontal Scroll) -->
<div class="flex overflow-x-auto gap-3 px-5 py-4 scrollbar-hide">
<!-- Active State -->
<button class="flex flex-col items-center gap-1.5 min-w-[72px] group">
<div class="h-14 w-14 rounded-2xl bg-[#cbfbdc] dark:bg-primary/20 flex items-center justify-center border-2 border-transparent group-hover:scale-105 transition-all">
<span class="material-symbols-outlined text-primary dark:text-primary text-[28px] fill-1">directions_car</span>
</div>
<span class="text-xs font-bold text-[#0d1b12] dark:text-white">City</span>
</button>
<!-- Inactive States -->
<button class="flex flex-col items-center gap-1.5 min-w-[72px] group opacity-60 hover:opacity-100 transition-opacity">
<div class="h-14 w-14 rounded-2xl bg-white dark:bg-gray-800 flex items-center justify-center shadow-sm border border-gray-100 dark:border-gray-700">
<span class="material-symbols-outlined text-[#0d1b12] dark:text-white text-[28px]">directions_bus</span>
</div>
<span class="text-xs font-medium text-[#0d1b12] dark:text-white">Intercity</span>
</button>
<button class="flex flex-col items-center gap-1.5 min-w-[72px] group opacity-60 hover:opacity-100 transition-opacity">
<div class="h-14 w-14 rounded-2xl bg-white dark:bg-gray-800 flex items-center justify-center shadow-sm border border-gray-100 dark:border-gray-700">
<span class="material-symbols-outlined text-[#0d1b12] dark:text-white text-[28px]">local_shipping</span>
</div>
<span class="text-xs font-medium text-[#0d1b12] dark:text-white">Freight</span>
</button>
<button class="flex flex-col items-center gap-1.5 min-w-[72px] group opacity-60 hover:opacity-100 transition-opacity">
<div class="h-14 w-14 rounded-2xl bg-white dark:bg-gray-800 flex items-center justify-center shadow-sm border border-gray-100 dark:border-gray-700">
<span class="material-symbols-outlined text-[#0d1b12] dark:text-white text-[28px]">package_2</span>
</div>
<span class="text-xs font-medium text-[#0d1b12] dark:text-white">Courier</span>
</button>
</div>
<!-- Main Form Container -->
<div class="px-5 pb-8 pt-2 flex flex-col gap-4">
<!-- Route Input Group -->
<div class="bg-white dark:bg-[#1a2e22] rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 overflow-hidden relative">
<!-- Vertical connecting line decor -->
<div class="absolute left-[26px] top-[24px] bottom-[24px] w-0.5 bg-gray-200 dark:bg-gray-600 flex flex-col justify-between items-center py-1">
<div class="w-1.5 h-1.5 bg-blue-500 rounded-full -ml-[2px] absolute top-0"></div>
<div class="w-1.5 h-1.5 bg-primary rounded-none -ml-[2px] absolute bottom-0"></div>
</div>
<!-- From Input -->
<div class="flex items-center h-14 px-4 relative">
<div class="w-8 flex justify-center shrink-0">
<!-- Dot is in the pseudo element above but placeholder logic here if needed -->
</div>
<input class="w-full bg-transparent border-none focus:ring-0 text-[#0d1b12] dark:text-white text-base font-medium placeholder-gray-400 p-0" readonly="" type="text" value="Current Location"/>
<button class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- Divider -->
<div class="h-[1px] bg-gray-100 dark:bg-gray-700 mx-10"></div>
<!-- To Input -->
<div class="flex items-center h-14 px-4 relative">
<div class="w-8 flex justify-center shrink-0">
</div>
<input class="w-full bg-transparent border-none focus:ring-0 text-[#0d1b12] dark:text-white text-lg font-semibold placeholder-gray-400 placeholder:font-normal p-0 auto-focus" placeholder="Where to?" type="text"/>
<button class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
<span class="material-symbols-outlined text-[20px]">map</span>
</button>
</div>
</div>
<!-- Fare & Comment Row -->
<div class="flex gap-3">
<!-- Fare Input (The Key Feature) -->
<div class="flex-1 bg-white dark:bg-[#1a2e22] rounded-xl h-14 flex items-center px-4 border border-gray-100 dark:border-gray-800 shadow-sm focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all">
<span class="text-green-600 dark:text-primary font-bold text-lg mr-2">$</span>
<input class="w-full bg-transparent border-none focus:ring-0 text-[#0d1b12] dark:text-white text-lg font-bold placeholder-gray-400 p-0" placeholder="Offer your fare" type="number"/>
</div>
<!-- Options / Comment Button -->
<button class="h-14 w-14 shrink-0 bg-white dark:bg-[#1a2e22] rounded-xl border border-gray-100 dark:border-gray-800 shadow-sm flex items-center justify-center text-gray-500 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
<span class="material-symbols-outlined">tune</span>
</button>
</div>
<!-- Action Button -->
<button class="w-full bg-primary hover:bg-[#0fd650] active:scale-[0.98] transition-all text-[#0d1b12] h-14 rounded-xl flex items-center justify-center gap-2 shadow-[0_4px_14px_rgba(19,236,91,0.4)] mt-2">
<span class="text-lg font-bold tracking-tight">Find a driver</span>
</button>
</div>
</div>
</body></html>
