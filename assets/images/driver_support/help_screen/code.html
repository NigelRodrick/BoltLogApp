<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Driver Support</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "primary-content": "#052e11", 
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1a2e22",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom scrollbar for clean look */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display transition-colors duration-200">
<div class="relative flex h-full min-h-screen w-full flex-col max-w-md mx-auto overflow-x-hidden bg-background-light dark:bg-background-dark pb-10">
<!-- Header -->
<div class="sticky top-0 z-50 flex items-center bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-md p-4 pb-2 justify-between border-b border-transparent dark:border-white/5">
<button class="text-slate-900 dark:text-white flex size-10 shrink-0 items-center justify-center rounded-full active:bg-slate-200 dark:active:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-10">Support</h2>
<div class="absolute right-4 top-1/2 -translate-y-1/2">
<button class="bg-red-50 text-red-600 dark:bg-red-900/20 dark:text-red-400 px-3 py-1.5 rounded-full text-sm font-bold tracking-wide flex items-center gap-1 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-base">sos</span>
                    SOS
                </button>
</div>
</div>
<!-- Greeting -->
<div class="px-5 pt-6 pb-2">
<h1 class="text-slate-900 dark:text-white tracking-tight text-[28px] font-bold leading-tight">Hello, Driver.<br/><span class="text-slate-500 dark:text-slate-400 font-medium text-xl">How can we help today?</span></h1>
</div>
<!-- Search Bar -->
<div class="px-4 py-4">
<label class="relative flex flex-col w-full group">
<div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-slate-500 dark:text-slate-400 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined">search</span>
</div>
<input class="form-input flex w-full rounded-xl border-none bg-white dark:bg-surface-dark py-4 pl-12 pr-4 text-slate-900 dark:text-white shadow-sm ring-1 ring-slate-900/5 dark:ring-white/10 focus:ring-2 focus:ring-primary focus:outline-none placeholder:text-slate-400 dark:placeholder:text-slate-500 text-base transition-all" placeholder="Search articles (e.g., 'payouts')..." value=""/>
</label>
</div>
<!-- Context Action (Last Trip) -->
<div class="px-4 mb-2">
<div class="group flex flex-col gap-3 rounded-xl border border-slate-100 dark:border-slate-700/50 bg-white dark:bg-surface-dark p-4 shadow-sm relative overflow-hidden">
<!-- Decorative gradient -->
<div class="absolute top-0 right-0 w-24 h-24 bg-primary/10 rounded-full -mr-10 -mt-10 blur-2xl"></div>
<div class="flex items-center justify-between relative z-10">
<div class="flex items-center gap-3">
<div class="h-10 w-10 rounded-full bg-primary/20 text-primary-content dark:text-primary flex items-center justify-center">
<span class="material-symbols-outlined">history</span>
</div>
<div>
<p class="text-slate-900 dark:text-white text-base font-bold leading-tight">Last Trip Issue</p>
<p class="text-slate-500 dark:text-slate-400 text-sm font-normal">Trip to Downtown Market • 24 mins ago</p>
</div>
</div>
</div>
<button class="mt-1 flex items-center justify-between w-full bg-slate-50 dark:bg-white/5 hover:bg-slate-100 dark:hover:bg-white/10 p-3 rounded-lg group transition-colors">
<span class="text-sm font-semibold text-slate-900 dark:text-white">Report a problem</span>
<span class="material-symbols-outlined text-slate-400 text-lg group-hover:translate-x-1 transition-transform">chevron_right</span>
</button>
</div>
</div>
<!-- Quick Categories Grid -->
<div class="px-4 py-4 grid grid-cols-2 gap-3">
<button class="flex flex-col items-center justify-center gap-2 p-4 rounded-xl bg-white dark:bg-surface-dark border border-slate-100 dark:border-white/5 shadow-sm active:scale-95 transition-all">
<span class="material-symbols-outlined text-3xl text-primary">account_balance_wallet</span>
<span class="text-sm font-semibold text-slate-700 dark:text-slate-200">Earnings</span>
</button>
<button class="flex flex-col items-center justify-center gap-2 p-4 rounded-xl bg-white dark:bg-surface-dark border border-slate-100 dark:border-white/5 shadow-sm active:scale-95 transition-all">
<span class="material-symbols-outlined text-3xl text-primary">person</span>
<span class="text-sm font-semibold text-slate-700 dark:text-slate-200">Account</span>
</button>
<button class="flex flex-col items-center justify-center gap-2 p-4 rounded-xl bg-white dark:bg-surface-dark border border-slate-100 dark:border-white/5 shadow-sm active:scale-95 transition-all">
<span class="material-symbols-outlined text-3xl text-primary">directions_car</span>
<span class="text-sm font-semibold text-slate-700 dark:text-slate-200">Vehicle</span>
</button>
<button class="flex flex-col items-center justify-center gap-2 p-4 rounded-xl bg-white dark:bg-surface-dark border border-slate-100 dark:border-white/5 shadow-sm active:scale-95 transition-all">
<span class="material-symbols-outlined text-3xl text-primary">gpp_maybe</span>
<span class="text-sm font-semibold text-slate-700 dark:text-slate-200">Safety</span>
</button>
</div>
<!-- Popular Topics -->
<div class="flex flex-col pt-2 pb-4">
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight px-4 pb-3">Popular Topics</h2>
<div class="flex flex-col divide-y divide-slate-100 dark:divide-slate-800 bg-white dark:bg-surface-dark border-y border-slate-100 dark:border-white/5">
<button class="flex w-full items-center justify-between p-4 text-left group hover:bg-slate-50 dark:hover:bg-white/5 transition-colors">
<span class="text-base font-medium text-slate-700 dark:text-slate-200">How do I change my vehicle details?</span>
<span class="material-symbols-outlined text-slate-400 group-hover:text-primary transition-colors">expand_more</span>
</button>
<button class="flex w-full items-center justify-between p-4 text-left group hover:bg-slate-50 dark:hover:bg-white/5 transition-colors">
<span class="text-base font-medium text-slate-700 dark:text-slate-200">Why was my account suspended?</span>
<span class="material-symbols-outlined text-slate-400 group-hover:text-primary transition-colors">expand_more</span>
</button>
<button class="flex w-full items-center justify-between p-4 text-left group hover:bg-slate-50 dark:hover:bg-white/5 transition-colors">
<span class="text-base font-medium text-slate-700 dark:text-slate-200">Understanding my earnings payout</span>
<span class="material-symbols-outlined text-slate-400 group-hover:text-primary transition-colors">expand_more</span>
</button>
<button class="flex w-full items-center justify-between p-4 text-left group hover:bg-slate-50 dark:hover:bg-white/5 transition-colors">
<span class="text-base font-medium text-slate-700 dark:text-slate-200">Troubleshoot GPS issues</span>
<span class="material-symbols-outlined text-slate-400 group-hover:text-primary transition-colors">expand_more</span>
</button>
</div>
<div class="px-4 py-3 text-right">
<a class="text-sm font-bold text-primary hover:opacity-80 transition-opacity" href="#">View all articles</a>
</div>
</div>
<!-- Contact Support -->
<div class="px-4 py-4 mb-6">
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight pb-3">Contact Us</h2>
<div class="bg-white dark:bg-surface-dark rounded-xl shadow-sm border border-slate-100 dark:border-white/5 p-5 flex flex-col gap-4">
<!-- Live Chat - Primary -->
<button class="w-full bg-primary text-primary-content rounded-lg p-4 flex items-center justify-between shadow-sm active:shadow-inner active:translate-y-px transition-all hover:bg-[#0fdc53]">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined">chat</span>
<div class="flex flex-col items-start">
<span class="text-base font-bold">Start Live Chat</span>
<span class="text-xs font-medium opacity-80">Wait time: ~2 mins</span>
</div>
</div>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
<div class="grid grid-cols-2 gap-4">
<!-- Phone -->
<button class="w-full bg-slate-50 dark:bg-white/5 text-slate-900 dark:text-white border border-slate-100 dark:border-white/10 rounded-lg p-4 flex flex-col items-center justify-center gap-2 hover:bg-slate-100 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-2xl">call</span>
<span class="text-sm font-bold">Call Support</span>
</button>
<!-- Email -->
<button class="w-full bg-slate-50 dark:bg-white/5 text-slate-900 dark:text-white border border-slate-100 dark:border-white/10 rounded-lg p-4 flex flex-col items-center justify-center gap-2 hover:bg-slate-100 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-2xl">mail</span>
<span class="text-sm font-bold">Email Us</span>
</button>
</div>
</div>
</div>
<!-- Footer -->
<div class="mt-auto py-6 text-center">
<p class="text-xs text-slate-400 font-medium">App Version 2.4.1</p>
<div class="flex items-center justify-center gap-4 mt-2">
<a class="text-xs text-slate-500 dark:text-slate-400 hover:text-primary transition-colors" href="#">Terms of Service</a>
<span class="text-slate-300 dark:text-slate-600">•</span>
<a class="text-xs text-slate-500 dark:text-slate-400 hover:text-primary transition-colors" href="#">Privacy Policy</a>
</div>
</div>
</div>
</body></html>
