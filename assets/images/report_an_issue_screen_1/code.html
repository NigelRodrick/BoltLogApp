<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Report an Issue</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1c2e22",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem", 
                        "lg": "0.5rem", 
                        "xl": "0.75rem", 
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hide for cleaner UI */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-gray-900 dark:text-gray-100 antialiased min-h-screen flex flex-col relative overflow-x-hidden selection:bg-primary selection:text-black">
<!-- Top App Bar -->
<header class="sticky top-0 z-50 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-sm transition-colors duration-200">
<div class="flex items-center justify-between p-4 pb-2">
<button aria-label="Go back" class="flex size-10 items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/10 active:scale-95 transition-all text-gray-900 dark:text-gray-100">
<span class="material-symbols-outlined text-[24px]">arrow_back_ios_new</span>
</button>
<h2 class="text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-10">Report an Issue</h2>
</div>
</header>
<main class="flex-1 flex flex-col p-4 gap-6 pb-24">
<!-- Context Card -->
<section aria-label="Ride Details">
<div class="bg-surface-light dark:bg-surface-dark p-4 rounded-xl shadow-sm border border-black/5 dark:border-white/5 flex gap-4 items-center">
<!-- Map Thumbnail -->
<div class="h-20 w-20 shrink-0 rounded-lg bg-gray-200 dark:bg-gray-700 overflow-hidden relative">
<img alt="Minimal map showing ride route" class="h-full w-full object-cover opacity-80" data-alt="Minimal map showing ride route" data-location="City map view" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCgiYc5v6RLSbVQ_zyek2O2YGVQvuIXvOg7tOxwter-_gHH24DOsW-k3fOJJUrOZ_AyCCJfH7L1bCHv19ecOPMLNiEMH5m-52btvinl5hWabtZcsmovY-IBRcvKH2RA8m65NT4jqjbmGvkiHKi7OijbGiUF3uxwHOv2Dd1Bncj-FLro0VjzcXiQK1tefkKryrmh9N28g9LqeImda3ieACNrIzhNqiovcqhzF795zy1z9L4XkxVGUR5Wk6KJTXE40raniWO9SX_abkM"/>
<div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent"></div>
</div>
<!-- Ride Info -->
<div class="flex flex-col flex-1 min-w-0">
<div class="flex justify-between items-start mb-1">
<h3 class="text-base font-bold truncate">Ride #9283</h3>
<span class="text-xs font-medium bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400 px-2 py-0.5 rounded-full">Completed</span>
</div>
<p class="text-sm text-gray-500 dark:text-gray-400 mb-1">Today, 10:30 AM</p>
<div class="flex items-center gap-1.5 text-xs text-gray-900 dark:text-gray-200 font-medium">
<span class="material-symbols-outlined text-[16px] text-gray-400">directions_car</span>
                        Toyota Camry • ABC 123
                    </div>
</div>
</div>
</section>
<!-- Issue Categories -->
<section aria-label="Issue Categories">
<h3 class="text-lg font-bold mb-3 px-1">What went wrong?</h3>
<div class="flex flex-wrap gap-3">
<!-- Selected Chip Example -->
<label class="group cursor-pointer">
<input class="peer sr-only" name="issue" type="radio" value="driver"/>
<div class="flex h-10 items-center justify-center gap-x-2 rounded-lg bg-surface-light dark:bg-surface-dark border border-transparent peer-checked:bg-primary peer-checked:border-primary peer-checked:text-black hover:bg-gray-100 dark:hover:bg-gray-800 px-4 transition-all duration-200 shadow-sm">
<span class="text-sm font-medium">Driver behavior</span>
</div>
</label>
<!-- Unselected Chips -->
<label class="group cursor-pointer">
<input class="peer sr-only" name="issue" type="radio" value="route"/>
<div class="flex h-10 items-center justify-center gap-x-2 rounded-lg bg-surface-light dark:bg-surface-dark border border-transparent peer-checked:bg-primary peer-checked:border-primary peer-checked:text-black hover:bg-gray-100 dark:hover:bg-gray-800 px-4 transition-all duration-200 shadow-sm">
<span class="text-sm font-medium">Route issue</span>
</div>
</label>
<label class="group cursor-pointer">
<input class="peer sr-only" name="issue" type="radio" value="vehicle"/>
<div class="flex h-10 items-center justify-center gap-x-2 rounded-lg bg-surface-light dark:bg-surface-dark border border-transparent peer-checked:bg-primary peer-checked:border-primary peer-checked:text-black hover:bg-gray-100 dark:hover:bg-gray-800 px-4 transition-all duration-200 shadow-sm">
<span class="text-sm font-medium">Vehicle condition</span>
</div>
</label>
<label class="group cursor-pointer">
<input class="peer sr-only" name="issue" type="radio" value="fare"/>
<div class="flex h-10 items-center justify-center gap-x-2 rounded-lg bg-surface-light dark:bg-surface-dark border border-transparent peer-checked:bg-primary peer-checked:border-primary peer-checked:text-black hover:bg-gray-100 dark:hover:bg-gray-800 px-4 transition-all duration-200 shadow-sm">
<span class="text-sm font-medium">Fare discrepancy</span>
</div>
</label>
<label class="group cursor-pointer">
<input class="peer sr-only" name="issue" type="radio" value="lost"/>
<div class="flex h-10 items-center justify-center gap-x-2 rounded-lg bg-surface-light dark:bg-surface-dark border border-transparent peer-checked:bg-primary peer-checked:border-primary peer-checked:text-black hover:bg-gray-100 dark:hover:bg-gray-800 px-4 transition-all duration-200 shadow-sm">
<span class="text-sm font-medium">Lost item</span>
</div>
</label>
</div>
</section>
<!-- Description Input -->
<section aria-label="Details Input" class="flex-1">
<h3 class="text-lg font-bold mb-3 px-1">Add details</h3>
<div class="relative group">
<textarea class="w-full min-h-[160px] bg-surface-light dark:bg-surface-dark border-0 rounded-xl p-4 text-base focus:ring-2 focus:ring-primary/50 placeholder:text-gray-400 dark:placeholder:text-gray-500 resize-none shadow-sm transition-shadow text-gray-900 dark:text-gray-100" placeholder="Please describe the situation in detail so our support team can help you..."></textarea>
<!-- Attachment & Counter Actions -->
<div class="absolute bottom-3 right-3 flex items-center gap-3">
<button class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-500 transition-colors" title="Attach image">
<span class="material-symbols-outlined text-[20px]">attach_file</span>
</button>
<span class="text-xs text-gray-400 font-medium">0/500</span>
</div>
</div>
<div class="mt-4 flex gap-3 overflow-x-auto pb-2 no-scrollbar">
<!-- Placeholder for attached image if any (Empty state hidden) -->
<!-- Example of an "Add Photo" helper button if not using the clip -->
<button class="flex items-center gap-2 px-4 py-2 rounded-lg border border-dashed border-gray-300 dark:border-gray-600 text-gray-500 hover:bg-gray-50 dark:hover:bg-white/5 transition-colors">
<span class="material-symbols-outlined text-[20px]">add_a_photo</span>
<span class="text-sm font-medium">Add Photo</span>
</button>
</div>
</section>
</main>
<!-- Sticky Footer CTA -->
<footer class="fixed bottom-0 left-0 w-full bg-background-light dark:bg-background-dark p-4 border-t border-black/5 dark:border-white/5 z-40 pb-8">
<button class="w-full bg-primary hover:bg-primary/90 active:bg-primary/80 text-black font-bold text-base h-12 rounded-xl flex items-center justify-center transition-transform active:scale-[0.99] shadow-lg shadow-primary/20">
            Submit Report
        </button>
</footer>
</body></html>
