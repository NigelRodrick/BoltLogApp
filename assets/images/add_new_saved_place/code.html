<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add New Saved Place</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "primary-dark": "#0eb545",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1c2e24",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Custom scrollbar for chips */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased text-slate-900 dark:text-white transition-colors duration-200">
<div class="relative flex min-h-screen w-full flex-col overflow-hidden max-w-md mx-auto bg-background-light dark:bg-background-dark shadow-2xl">
<!-- Top App Bar -->
<header class="sticky top-0 z-30 flex items-center justify-between px-4 py-4 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-sm">
<button class="flex items-center justify-center size-10 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-slate-900 dark:text-white">arrow_back</span>
</button>
<h1 class="text-lg font-bold leading-tight tracking-tight text-center flex-1">Add New Place</h1>
<div class="size-10"></div> <!-- Spacer for balance -->
</header>
<main class="flex-1 flex flex-col px-5 pb-24 space-y-6 overflow-y-auto">
<!-- Address Search Input -->
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1" for="address">Address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
<span class="material-symbols-outlined text-slate-400 group-focus-within:text-primary transition-colors">search</span>
</div>
<input class="block w-full h-14 pl-12 pr-4 rounded-xl bg-surface-light dark:bg-surface-dark border-0 ring-1 ring-slate-200 dark:ring-slate-700 focus:ring-2 focus:ring-primary dark:focus:ring-primary placeholder:text-slate-400 text-base shadow-sm transition-all" id="address" placeholder="Enter address or place name" type="text" value=""/>
<!-- Close/Clear icon could go here if value exists -->
</div>
</div>
<!-- Map View -->
<div class="relative w-full rounded-2xl overflow-hidden shadow-sm border border-slate-100 dark:border-slate-800 h-48 sm:h-56 group cursor-pointer">
<!-- Map Image -->
<div class="w-full h-full bg-cover bg-center transition-transform duration-700 group-hover:scale-105" data-alt="Overhead map view of city streets with green parks" data-location="New York City" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDslx5N9oquf9dD6dQXBSX8joZDSmweMn6pDbQXMDA0LDr4Wzr3NW44jYTtkY8ACs8DVC8vDkRg2zyvogffMeStQwMMaPhP9HkkWTmzfrVPuDLSdH10pdSI8YS4qe0dUpvZjaCiCivhks97nNET7L1e9YkUEM5MYgidne8tBqtrAHhpUIDOJrxaZaKzJyGi3gMbJnifWOmx6nMRdrgDXq5lxVWnSWsBVCng3e9BRV5TgORaMzrrTsDUluXHu8eyhEHkZGiGPzyAAZE');"></div>
<!-- Map Overlay Gradient -->
<div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent pointer-events-none"></div>
<!-- Center Pin -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 flex flex-col items-center justify-center drop-shadow-lg">
<div class="relative">
<span class="material-symbols-outlined filled text-primary text-5xl">location_on</span>
<div class="absolute bottom-1 left-1/2 -translate-x-1/2 w-3 h-1 bg-black/30 rounded-full blur-[2px]"></div>
</div>
</div>
<!-- Edit Location Button Overlay -->
<div class="absolute bottom-3 right-3">
<button class="bg-surface-light dark:bg-surface-dark text-slate-900 dark:text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow-md flex items-center gap-1 hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
<span class="material-symbols-outlined text-[16px]">edit_location</span>
                        Adjust on map
                    </button>
</div>
</div>
<!-- Place Name (Optional) -->
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1" for="placeName">Name this place <span class="text-slate-400 font-normal">(Optional)</span></label>
<div class="relative group">
<input class="block w-full h-14 px-4 rounded-xl bg-surface-light dark:bg-surface-dark border-0 ring-1 ring-slate-200 dark:ring-slate-700 focus:ring-2 focus:ring-primary dark:focus:ring-primary placeholder:text-slate-400 text-base shadow-sm transition-all" id="placeName" placeholder="e.g., Mom's House" type="text"/>
</div>
</div>
<!-- Quick Chips -->
<div class="flex flex-col gap-3">
<p class="text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1">Quick Tags</p>
<div class="flex gap-3 overflow-x-auto hide-scrollbar pb-2">
<!-- Home Chip (Active State Example) -->
<button class="group flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-full bg-primary/10 border border-primary/20 hover:bg-primary/20 active:bg-primary/30 pl-4 pr-5 transition-all">
<span class="material-symbols-outlined filled text-primary-dark dark:text-primary text-[20px]">home</span>
<span class="text-primary-dark dark:text-primary text-sm font-bold">Home</span>
</button>
<!-- Work Chip -->
<button class="group flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-full bg-surface-light dark:bg-surface-dark border border-slate-200 dark:border-slate-700 hover:border-primary/50 dark:hover:border-primary/50 hover:bg-slate-50 dark:hover:bg-slate-800 pl-4 pr-5 transition-all">
<span class="material-symbols-outlined text-slate-500 dark:text-slate-400 group-hover:text-primary transition-colors text-[20px]">work</span>
<span class="text-slate-600 dark:text-slate-300 group-hover:text-slate-900 dark:group-hover:text-white text-sm font-medium transition-colors">Work</span>
</button>
<!-- Gym Chip -->
<button class="group flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-full bg-surface-light dark:bg-surface-dark border border-slate-200 dark:border-slate-700 hover:border-primary/50 dark:hover:border-primary/50 hover:bg-slate-50 dark:hover:bg-slate-800 pl-4 pr-5 transition-all">
<span class="material-symbols-outlined text-slate-500 dark:text-slate-400 group-hover:text-primary transition-colors text-[20px]">fitness_center</span>
<span class="text-slate-600 dark:text-slate-300 group-hover:text-slate-900 dark:group-hover:text-white text-sm font-medium transition-colors">Gym</span>
</button>
<!-- Other Chip -->
<button class="group flex h-10 shrink-0 items-center justify-center gap-x-2 rounded-full bg-surface-light dark:bg-surface-dark border border-slate-200 dark:border-slate-700 hover:border-primary/50 dark:hover:border-primary/50 hover:bg-slate-50 dark:hover:bg-slate-800 pl-4 pr-5 transition-all">
<span class="material-symbols-outlined text-slate-500 dark:text-slate-400 group-hover:text-primary transition-colors text-[20px]">star</span>
<span class="text-slate-600 dark:text-slate-300 group-hover:text-slate-900 dark:group-hover:text-white text-sm font-medium transition-colors">Other</span>
</button>
</div>
</div>
</main>
<!-- Sticky Bottom Button -->
<div class="absolute bottom-0 left-0 w-full p-4 bg-gradient-to-t from-background-light via-background-light to-transparent dark:from-background-dark dark:via-background-dark pt-8">
<button class="w-full h-14 flex items-center justify-center gap-2 bg-primary hover:bg-primary-dark text-[#051f10] text-lg font-bold rounded-xl shadow-lg shadow-primary/20 hover:shadow-primary/30 active:scale-[0.98] transition-all duration-200">
<span>Save Place</span>
<span class="material-symbols-outlined">check</span>
</button>
</div>
</div>
</body></html>
