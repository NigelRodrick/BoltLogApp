# Builds iOS on macOS (unsigned archive — sign locally or in App Store Connect).
# Download: GitHub → Actions → "Build iOS archive" → Artifacts → boltlog-ios-archive
# Trigger: push to main (when ios/lib paths change), or Actions → Run workflow.
name: Build iOS archive

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "lib/**"
      - "ios/**"
      - "pubspec.yaml"
      - ".github/workflows/build-ios.yml"

permissions:
  contents: read
  actions: write # upload-artifact

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Dart & Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      # Build an unsigned iOS archive. With --no-codesign, Flutter does NOT create an .ipa,
      # it only creates Runner.xcarchive in build/ios/archive.
      - name: Build iOS archive (no codesign)
        run: flutter build ipa --release --no-codesign

      - name: Upload iOS archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: boltlog-ios-archive
          path: build/ios/archive/
          if-no-files-found: error
          retention-days: 90

