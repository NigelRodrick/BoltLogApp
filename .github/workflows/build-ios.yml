# iOS archive on macOS (unsigned). Artifact: boltlog-ios-archive.
# AUTO: every push to main/master + manual Run workflow.
# PRs: builds when app-related paths change.
name: Build iOS archive

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
    paths:
      - "lib/**"
      - "ios/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "firebase_options.dart"
      - "analysis_options.yaml"
      - ".github/workflows/build-ios.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: build-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Dart & Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Build iOS archive (no codesign)
        run: flutter build ipa --release --no-codesign

      - name: Upload iOS archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: boltlog-ios-archive
          path: build/ios/archive/
          if-no-files-found: error
          retention-days: 90
