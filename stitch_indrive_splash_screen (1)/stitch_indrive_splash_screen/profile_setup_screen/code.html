<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Profile Setup</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec13",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102210",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom scrollbar hiding for clean UI */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased selection:bg-primary selection:text-black">
<div class="relative flex min-h-screen w-full flex-col overflow-hidden max-w-md mx-auto shadow-xl bg-background-light dark:bg-background-dark">
<!-- TopAppBar -->
<header class="sticky top-0 z-20 flex items-center justify-between px-4 py-3 bg-background-light/90 dark:bg-background-dark/90 backdrop-blur-sm">
<button class="flex size-10 items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors group">
<span class="material-symbols-outlined text-slate-900 dark:text-white" style="font-size: 24px;">arrow_back_ios_new</span>
</button>
<h2 class="text-base font-semibold leading-tight flex-1 text-center opacity-0">Profile Setup</h2>
<button class="flex h-10 items-center justify-center px-2 rounded-lg hover:bg-primary/10 transition-colors">
<p class="text-primary text-base font-bold leading-normal">Skip</p>
</button>
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col px-6 pt-2 pb-32 overflow-y-auto no-scrollbar">
<!-- Headline & BodyText -->
<div class="mb-8 text-center animate-fade-in-up">
<h1 class="text-3xl font-bold tracking-tight mb-3 text-slate-900 dark:text-white">Complete your profile</h1>
<p class="text-slate-500 dark:text-slate-400 text-base leading-relaxed px-4">
                    Drivers and passengers prefer users with a photo and name. It helps build trust.
                </p>
</div>
<!-- ProfileHeader / Photo Upload -->
<div class="flex flex-col items-center mb-8">
<div class="relative group cursor-pointer">
<div class="size-32 rounded-full bg-slate-200 dark:bg-slate-800 border-4 border-white dark:border-slate-900 shadow-sm overflow-hidden bg-cover bg-center" data-alt="Abstract silhouette placeholder for user profile avatar" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAbkaqFMwlB3xRnhJ5FG80ODKtdz3XR2FucilyO5NrHWvWvl6QACmYKpxY9SqmEAPeq0Tuo-ijStTTS6jL0Ll7ZMzyYoefl33gbZnB-VdCpdoHIf51F0Lsz_TyGOL53emtdGdzUTEnMnffntRBs-satSha7G5jOyHlvT2AwhdCfg613Pl3bRS4f69-pq7dMYPoKFO45TeQ80gbqFX_sKBodzuWh_jwHCfBhMw6iKEHFGs2YRuwfdtxDumL5_M1RnnUa3sp472Hf3JI');">
<!-- Overlay for hover effect -->
<div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
<span class="material-symbols-outlined text-white">edit</span>
</div>
</div>
<button class="absolute bottom-1 right-1 bg-primary text-black p-2 rounded-full shadow-lg hover:scale-105 transition-transform flex items-center justify-center border-2 border-white dark:border-background-dark">
<span class="material-symbols-outlined" style="font-size: 20px;">photo_camera</span>
</button>
</div>
<p class="mt-3 text-sm font-medium text-primary cursor-pointer hover:underline">Edit photo</p>
</div>
<!-- Form Fields -->
<div class="flex flex-col gap-5">
<!-- Full Name -->
<div class="group">
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5 ml-1">Full Name</label>
<div class="relative">
<input class="w-full h-14 rounded-xl border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800/50 text-slate-900 dark:text-white px-4 pt-1 pb-1 outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all placeholder:text-slate-400" placeholder="e.g. John Doe" type="text"/>
<div class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">
<span class="material-symbols-outlined text-xl">person</span>
</div>
</div>
</div>
<!-- City -->
<div class="group">
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5 ml-1">City</label>
<div class="relative">
<select class="w-full h-14 rounded-xl border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800/50 text-slate-900 dark:text-white px-4 pr-10 outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all appearance-none cursor-pointer">
<option disabled="" selected="" value="">Select your city</option>
<option value="ny">New York</option>
<option value="la">Los Angeles</option>
<option value="ch">Chicago</option>
<option value="sf">San Francisco</option>
</select>
<div class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none flex items-center">
<span class="material-symbols-outlined text-xl">expand_more</span>
</div>
</div>
</div>
<!-- Language (Optional) -->
<div class="group">
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5 ml-1">
                        Language <span class="text-slate-400 font-normal text-xs ml-1">(Optional)</span>
</label>
<div class="relative">
<select class="w-full h-14 rounded-xl border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800/50 text-slate-900 dark:text-white px-4 pr-10 outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all appearance-none cursor-pointer">
<option disabled="" selected="" value="">Preferred language</option>
<option value="en">English</option>
<option value="es">Spanish</option>
<option value="fr">French</option>
<option value="pt">Portuguese</option>
</select>
<div class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none flex items-center">
<span class="material-symbols-outlined text-xl">translate</span>
</div>
</div>
</div>
<!-- Bio (Optional) -->
<div class="group">
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5 ml-1">
                        About me <span class="text-slate-400 font-normal text-xs ml-1">(Optional)</span>
</label>
<textarea class="w-full rounded-xl border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800/50 text-slate-900 dark:text-white px-4 py-3 outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all placeholder:text-slate-400 resize-none h-24" placeholder="Tell us a little about yourself..."></textarea>
</div>
</div>
</main>
<!-- Fixed Footer Action -->
<div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto p-4 bg-background-light dark:bg-background-dark border-t border-slate-100 dark:border-slate-800 z-10">
<button class="w-full h-14 bg-primary hover:bg-green-400 active:scale-[0.98] transition-all rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-primary/20">
<span class="text-black text-lg font-bold">Save &amp; Continue</span>
<span class="material-symbols-outlined text-black font-bold">arrow_forward</span>
</button>
</div>
</div>
</body></html>
