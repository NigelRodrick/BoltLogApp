<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login Screen</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar hide for cleaner mobile look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-gray-900 dark:text-white transition-colors duration-200">
<div class="relative flex min-h-screen w-full flex-col group/design-root overflow-x-hidden font-display">
<!-- Header / Nav -->
<div class="flex items-center justify-between p-4">
<button class="p-2 -ml-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
<span class="material-symbols-outlined text-gray-900 dark:text-white" style="font-size: 24px;">arrow_back</span>
</button>
<div class="flex gap-2">
<!-- Role Toggle (User/Driver) -->
<div class="flex bg-gray-200 dark:bg-gray-800 rounded-lg p-1">
<button class="px-4 py-1 text-xs font-semibold bg-white dark:bg-gray-700 shadow-sm rounded-md text-gray-900 dark:text-white">Passenger</button>
<button class="px-4 py-1 text-xs font-medium text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition-colors">Driver</button>
</div>
</div>
</div>
<!-- Main Content Area -->
<div class="flex-1 flex flex-col px-6 pt-4 pb-8 max-w-md mx-auto w-full">
<!-- Branding -->
<div class="flex flex-col items-center mb-8">
<div class="w-20 h-20 bg-primary/20 rounded-2xl flex items-center justify-center mb-6">
<!-- Abstract logo shape -->
<div class="w-12 h-12 bg-primary rounded-xl flex items-center justify-center transform rotate-3">
<span class="material-symbols-outlined text-black" style="font-size: 32px;">local_taxi</span>
</div>
</div>
<h1 class="text-3xl font-bold text-center text-gray-900 dark:text-white mb-2">Log in to continue</h1>
<p class="text-center text-gray-500 dark:text-gray-400 text-sm">Welcome back! Please enter your details.</p>
</div>
<!-- Login Form -->
<div class="flex flex-col gap-5">
<!-- Phone/Email Field -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-gray-900 dark:text-gray-200">Phone or Email</label>
<div class="relative">
<input class="w-full h-14 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg px-4 text-base text-gray-900 dark:text-white placeholder:text-gray-400 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" placeholder="+1 (555) 000-0000" type="text"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
<span class="material-symbols-outlined" style="font-size: 20px;">smartphone</span>
</span>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-gray-900 dark:text-gray-200">Password</label>
<div class="relative flex items-center">
<input class="w-full h-14 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg px-4 pr-12 text-base text-gray-900 dark:text-white placeholder:text-gray-400 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all" placeholder="•••••••••" type="password"/>
<button class="absolute right-0 h-full px-4 flex items-center text-primary hover:text-green-600 dark:hover:text-green-400 transition-colors">
<span class="material-symbols-outlined" style="font-size: 24px;">visibility</span>
</button>
</div>
<div class="flex justify-end">
<a class="text-sm font-medium text-primary hover:text-green-600 dark:hover:text-green-400 transition-colors" href="#">Forgot Password?</a>
</div>
</div>
<!-- Login Button -->
<button class="w-full h-14 mt-2 bg-primary hover:bg-green-400 text-black font-semibold rounded-lg text-lg transition-colors shadow-sm flex items-center justify-center gap-2">
<span>Log In</span>
<span class="material-symbols-outlined" style="font-size: 20px;">arrow_forward</span>
</button>
</div>
<!-- Social Login Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-gray-200 dark:border-gray-700"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-4 bg-background-light dark:bg-background-dark text-gray-500 dark:text-gray-400">Or continue with</span>
</div>
</div>
<!-- Social Buttons Grid -->
<div class="grid grid-cols-3 gap-3">
<button class="flex items-center justify-center h-14 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors group">
<!-- Google Placeholder -->
<span class="material-symbols-outlined text-gray-600 dark:text-gray-300 group-hover:text-primary transition-colors" style="font-size: 24px;">language</span>
</button>
<button class="flex items-center justify-center h-14 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors group">
<!-- Apple Placeholder -->
<span class="material-symbols-outlined text-gray-900 dark:text-white" style="font-size: 24px;">star</span>
</button>
<button class="flex items-center justify-center h-14 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors group">
<!-- Facebook Placeholder -->
<span class="material-symbols-outlined text-blue-600 dark:text-blue-500" style="font-size: 24px;">public</span>
</button>
</div>
<!-- Footer Signup Link -->
<div class="mt-auto pt-8 flex justify-center">
<p class="text-gray-600 dark:text-gray-400 text-sm">
                    Don't have an account? 
                    <a class="font-semibold text-primary hover:text-green-600 dark:hover:text-green-400 transition-colors ml-1" href="#">Sign Up</a>
</p>
</div>
</div>
<!-- Bottom Safe Area Spacer -->
<div class="h-6 w-full"></div>
</div>
</body></html>
