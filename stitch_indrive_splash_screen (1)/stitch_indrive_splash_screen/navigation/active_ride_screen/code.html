<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Driver Navigation UI</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                        "surface-dark": "#112217",
                        "surface-card": "#193322",
                        "text-secondary": "#92c9a4",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "3xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-dark text-white font-display overflow-hidden">
<div class="relative flex h-screen w-full flex-col group/design-root">
<!-- Map Layer -->
<!-- The map takes up the full space behind the UI elements -->
<div class="absolute inset-0 z-0">
<!-- Map Image -->
<div class="w-full h-full bg-cover bg-center opacity-80" data-alt="Dark mode stylized map of city streets" data-location="San Francisco" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBJy0PuClWWNeyBwON58rmi2SGa97cmySWbtFLGBZsU5ht1ushSh7svjvc1KjXPI9KH8utBrOuHbfa798GsoCwAdn_0-wk_Xtyh88lmRCRObwyS1JEheRDWaTD8x3gvc7zztcxUUDZD92270aqCUuEB6Kl_JmO6nglcZ0FjjJV4sLDBoM6uyzVAD7Q3HnVGikLCbluOet5Br52GYk6YMcTNhJJIHFygMzLJJ6sKGqHTTQzhrwG-EY7O-rwk8VAje7y_ZmO8crtfmuk'); filter: grayscale(100%) invert(85%) contrast(120%) hue-rotate(100deg);">
</div>
<!-- Map Gradient Overlay for better text visibility at top -->
<div class="absolute top-0 left-0 w-full h-32 bg-gradient-to-b from-[#102216]/90 to-transparent pointer-events-none"></div>
</div>
<!-- Top Layer: Navigation & Controls -->
<div class="relative z-10 flex-1 flex flex-col p-4 pointer-events-none">
<!-- Navigation Instruction Card -->
<!-- Optimized for glanceability while driving -->
<div class="pointer-events-auto bg-surface-card border border-surface-card/50 shadow-xl rounded-xl p-4 flex items-center gap-5 max-w-md w-full mx-auto animate-fade-in-down">
<div class="bg-surface-dark w-16 h-16 rounded-lg flex items-center justify-center shrink-0 border border-text-secondary/20">
<span class="material-symbols-outlined text-primary" style="font-size: 40px; font-weight: 700;">turn_right</span>
</div>
<div class="flex flex-col">
<h1 class="text-3xl font-extrabold leading-tight text-white">200m</h1>
<p class="text-text-secondary text-lg font-medium leading-tight">Turn right on Main St</p>
</div>
</div>
<!-- Map Interactions (Right Side) -->
<div class="pointer-events-auto absolute right-4 top-1/2 -translate-y-1/2 flex flex-col gap-3">
<button class="flex w-12 h-12 items-center justify-center rounded-full bg-surface-card shadow-lg text-white hover:bg-surface-card/80 transition-colors border border-white/5">
<span class="material-symbols-outlined">add</span>
</button>
<button class="flex w-12 h-12 items-center justify-center rounded-full bg-surface-card shadow-lg text-white hover:bg-surface-card/80 transition-colors border border-white/5">
<span class="material-symbols-outlined">remove</span>
</button>
<button class="flex w-12 h-12 items-center justify-center rounded-full bg-surface-card shadow-lg text-primary hover:bg-surface-card/80 transition-colors mt-2 border border-primary/20">
<span class="material-symbols-outlined">my_location</span>
</button>
</div>
</div>
<!-- Bottom Sheet Layer -->
<!-- Rounded top corners, slides up from bottom visually -->
<div class="relative z-20 bg-surface-dark rounded-t-3xl shadow-[0_-8px_30px_rgba(0,0,0,0.5)] border-t border-white/5 pb-6">
<!-- Handle -->
<div class="w-full flex justify-center pt-3 pb-2 cursor-pointer">
<div class="h-1.5 w-12 rounded-full bg-[#326744]"></div>
</div>
<div class="px-5 pt-2 pb-6 flex flex-col gap-6">
<!-- Passenger Header -->
<div class="flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="relative">
<div class="bg-center bg-no-repeat bg-cover rounded-full h-14 w-14 border-2 border-surface-card" data-alt="Profile picture of passenger Alice M." style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDxtg-UfmhqkUuV7oBRlg1o_JqW0Hy1d9ElpO5vTd-uFqj2HSOah1h-8mf2kr9XGT98jIhoA6-hizx2xo_C9uDHbqZlLXYHqXzNlEiJSO7bpw7cM0g_ptFWN6buW9MkpGRl5EEWvGSmvI60VAYpP7K8uLrA804ABm2i05AwDS2qvGb4-3Sxq-wfw_MeY9QhXaaUltEf8CDZUoSBtsR7sFL6f0OHlVjQKuvGar24hoxS6_k6_FoqvUzx-SBQki4lVKT821O4cn5yMrY");'>
</div>
<div class="absolute -bottom-1 -right-1 bg-surface-dark rounded-full p-0.5">
<span class="material-symbols-outlined text-primary text-sm bg-surface-card rounded-full p-0.5">star</span>
</div>
</div>
<div class="flex flex-col justify-center">
<p class="text-white text-lg font-bold leading-normal">Alice M.</p>
<div class="flex items-center gap-1">
<span class="text-primary text-sm font-bold">4.8</span>
<span class="text-text-secondary text-sm font-normal">• 24 rides</span>
</div>
</div>
</div>
<div class="flex flex-col items-end">
<span class="text-white font-bold text-xl">$14.50</span>
<span class="text-text-secondary text-xs bg-surface-card px-2 py-0.5 rounded text-center">Cash</span>
</div>
</div>
<!-- Trip Progress / Route -->
<div class="bg-surface-card/50 rounded-xl p-4 flex gap-4 border border-white/5">
<!-- Timeline Line -->
<div class="flex flex-col items-center pt-1.5 w-5">
<div class="w-3 h-3 rounded-full bg-primary ring-4 ring-primary/20"></div>
<div class="w-0.5 flex-1 bg-gradient-to-b from-primary/50 to-text-secondary/30 my-1 min-h-[40px]"></div>
<div class="w-3 h-3 rounded-sm border-2 border-text-secondary"></div>
</div>
<!-- Addresses -->
<div class="flex flex-col gap-5 flex-1">
<div>
<div class="flex justify-between items-baseline mb-0.5">
<span class="text-primary text-xs font-bold uppercase tracking-wider">Picking up • 4 min</span>
<span class="text-text-secondary text-xs">0.8 mi</span>
</div>
<p class="text-white text-base font-medium leading-snug truncate">1234 Design Ave, Tech City</p>
</div>
<!-- Drop off (Dimmed slightly as it is the next step) -->
<div class="opacity-60">
<span class="text-text-secondary text-xs font-bold uppercase tracking-wider block mb-0.5">Drop off</span>
<p class="text-white text-base font-medium leading-snug truncate">880 Townsend St, SoMa</p>
</div>
</div>
</div>
<!-- Quick Actions Grid -->
<div class="grid grid-cols-4 gap-3">
<button class="col-span-1 h-14 rounded-xl bg-surface-card flex flex-col items-center justify-center text-white active:scale-95 transition-transform border border-white/5 group">
<span class="material-symbols-outlined text-2xl mb-0.5 group-hover:text-primary transition-colors">call</span>
<span class="text-[10px] text-text-secondary font-medium">Call</span>
</button>
<button class="col-span-1 h-14 rounded-xl bg-surface-card flex flex-col items-center justify-center text-white active:scale-95 transition-transform border border-white/5 group">
<span class="material-symbols-outlined text-2xl mb-0.5 group-hover:text-primary transition-colors">chat_bubble</span>
<span class="text-[10px] text-text-secondary font-medium">Chat</span>
</button>
<button class="col-span-1 h-14 rounded-xl bg-surface-card flex flex-col items-center justify-center text-white active:scale-95 transition-transform border border-white/5 group">
<span class="material-symbols-outlined text-2xl mb-0.5 text-red-400">local_police</span>
<span class="text-[10px] text-text-secondary font-medium">Safety</span>
</button>
<button class="col-span-1 h-14 rounded-xl bg-surface-card flex flex-col items-center justify-center text-white active:scale-95 transition-transform border border-white/5 group">
<span class="material-symbols-outlined text-2xl mb-0.5 group-hover:text-white transition-colors">more_horiz</span>
<span class="text-[10px] text-text-secondary font-medium">More</span>
</button>
</div>
<!-- Primary Action Button (FAB Style) -->
<button class="w-full h-16 bg-primary hover:bg-[#10d650] active:scale-[0.98] transition-all rounded-xl flex items-center justify-between px-2 pl-6 shadow-[0_0_20px_rgba(19,236,91,0.2)] group cursor-pointer">
<div class="flex flex-col items-start">
<span class="text-surface-dark font-extrabold text-lg tracking-tight">I've Arrived</span>
<span class="text-surface-dark/70 text-xs font-medium">Swipe to notify passenger</span>
</div>
<!-- Swipe indicator visual -->
<div class="bg-surface-dark/10 h-12 w-12 rounded-lg flex items-center justify-center group-hover:translate-x-1 transition-transform">
<span class="material-symbols-outlined text-surface-dark text-3xl">arrow_forward</span>
</div>
</button>
</div>
</div>
</div>
</body></html>
