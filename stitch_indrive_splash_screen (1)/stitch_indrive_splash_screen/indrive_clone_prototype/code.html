    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;
        const { MemoryRouter, Routes, Route, Link, useNavigate, useLocation } = ReactRouterDOM;

        // --- Shared Components ---

        const NavLink = ({ to, icon, label, active }) => {
            const navigate = useNavigate();
            return (
                <button 
                    onClick={() => navigate(to)}
                    className={`flex flex-col items-center gap-1 p-2 transition-colors ${active ? 'text-primary' : 'text-gray-400 hover:text-gray-900 dark:hover:text-white'}`}

                    <span className={`material-symbols-outlined ${active ? 'icon-filled' : ''}`} style={{fontSize: '24px'}}>{icon}</span>
                    <span className="text-[10px] font-medium">{label}</span>
                </button>
            );
        };

        const BottomNav = ({ role = 'passenger' }) => {
            const location = useLocation();
            const currentPath = location.pathname;

            if (role === 'driver') {
                return (
                    <nav className="fixed bottom-0 left-0 right-0 z-50 bg-white dark:bg-surface-dark border-t border-gray-100 dark:border-gray-800 px-6 py-2 pb-safe shadow-[0_-5px_10px_rgba(0,0,0,0.02)]">

                            <NavLink to="/driver/earnings" icon="account_balance_wallet" label="Earnings" active={currentPath.includes('earnings')} />
                            <NavLink to="/driver/ratings" icon="star" label="Ratings" active={currentPath.includes('ratings')} />
                            <NavLink to="/driver/profile" icon="person" label="Profile" active={currentPath.includes('profile')} />

                        <NavLink to="/passenger/home" icon="home" label="Home" active={currentPath.includes('home')} />

            const navigate = useNavigate();

                            </div>
                            <h1 className="text-3xl font-bold text-center text-gray-900 dark:text-white mb-2">Welcome Back</h1>

                        </div>
                        <div className="flex flex-col gap-5">
                            <div className="flex flex-col gap-2">
                                <label className="text-sm font-medium text-gray-900 dark:text-gray-200">Phone Number</label>
                                <div className="flex rounded-xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 overflow-hidden focus-within:ring-2 focus-within:ring-primary/50 transition-all">
                                    <div className="flex items-center px-3 border-r border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800">

                            </div>
                            <button onClick={() => navigate('/otp')} className="w-full h-14 mt-2 bg-primary hover:bg-green-400 text-black font-semibold rounded-lg text-lg transition-colors shadow-sm flex items-center justify-center gap-2">

                            </p>

                            <fieldset className="flex justify-center gap-4">
                                {[1, 2, 3, 4].map((_, i) => (
                                    <input key={i} className="w-14 h-16 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/50 text-center text-3xl font-semibold text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all caret-primary" maxLength="1" type="number" />

                                <p className="text-sm font-medium text-gray-600 dark:text-gray-300">Resend code in <span className="font-bold">00:24</span></p>
