<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>InDrive Clone - Request Ride</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Config -->
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#13ec5b",
              "background-light": "#f6f8f6",
              "background-dark": "#102216",
              "surface-light": "#ffffff",
              "surface-dark": "#1c2e22",
            },
            fontFamily: {
              "display": ["Plus Jakarta Sans", "sans-serif"]
            },
            borderRadius: {
              "DEFAULT": "0.25rem",
              "lg": "0.5rem",
              "xl": "0.75rem",
              "2xl": "1rem",
              "3xl": "1.5rem",
              "full": "9999px"
            },
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white h-screen w-full overflow-hidden flex flex-col">
<!-- Map Layer -->
<div class="absolute inset-0 z-0 bg-cover bg-center" data-alt="Abstract map view of city streets with light colors" data-location="New York City" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDSF9nz-JPJZNr-lOoyZaxStsO1U3Mn09UT9lzlcP4tHVF9FW37AaO7mOjm37dUKhI04lUkro8qjTl_lCrgE55jzazUCpHzDc1CYC5XZyAzX3aP0xN0fybZPl0toXar5wniAldx1wHNmW_qZ2rcPeK4m6GGVeffAo1zs1H7_flkIb8r8ghbi_Pyer-t7Fw9dm9HjiOLZHT2Kke07EJfcBSac8ukR0V34dx0yXJE_qxm7lDIKfLvt0dt7OjRogmvZx81fg3-EAXWLP0');">
<!-- Overlay for better text contrast if needed, mostly transparent here -->
<div class="absolute inset-0 bg-gradient-to-b from-black/10 to-transparent pointer-events-none"></div>
<!-- Top Floating Buttons -->
<div class="absolute top-0 left-0 right-0 p-4 pt-12 flex justify-between items-start z-10">
<!-- Menu Button -->
<button class="flex items-center justify-center size-12 rounded-full bg-surface-light dark:bg-surface-dark shadow-lg text-slate-800 dark:text-white hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
<span class="material-symbols-outlined">menu</span>
</button>
<!-- Right Side Buttons -->
<div class="flex flex-col gap-3">
<button class="flex items-center justify-center size-12 rounded-full bg-surface-light dark:bg-surface-dark shadow-lg text-slate-800 dark:text-white hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
<span class="material-symbols-outlined">security</span>
</button>
</div>
</div>
<!-- Location Center Button -->
<div class="absolute bottom-[55%] right-4 z-10 flex flex-col gap-3">
<button class="flex items-center justify-center size-12 rounded-full bg-surface-light dark:bg-surface-dark shadow-lg text-primary hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
<span class="material-symbols-outlined">my_location</span>
</button>
</div>
</div>
<!-- Bottom Sheet Container -->
<div class="absolute bottom-0 w-full z-20 flex flex-col justify-end pointer-events-none h-full">
<!-- The Sheet Itself -->
<div class="bg-background-light dark:bg-surface-dark rounded-t-3xl shadow-[0_-4px_20px_rgba(0,0,0,0.1)] w-full pointer-events-auto flex flex-col max-h-[85vh] transition-transform">
<!-- Handle -->
<div class="w-full flex justify-center pt-3 pb-2 cursor-grab active:cursor-grabbing">
<div class="w-12 h-1.5 bg-gray-300 dark:bg-gray-600 rounded-full"></div>
</div>
<!-- Service Type Tabs -->
<div class="px-2 border-b border-gray-200 dark:border-gray-700">
<div class="flex items-center justify-between gap-2 overflow-x-auto pb-2 scrollbar-hide">
<button class="flex flex-col items-center justify-center min-w-[70px] py-2 gap-1 group">
<div class="p-2 rounded-xl bg-primary/20 text-primary dark:text-primary transition-colors">
<span class="material-symbols-outlined text-[28px]">directions_car</span>
</div>
<span class="text-xs font-bold text-slate-900 dark:text-white">Ride</span>
</button>
<button class="flex flex-col items-center justify-center min-w-[70px] py-2 gap-1 group opacity-60 hover:opacity-100 transition-opacity">
<div class="p-2 rounded-xl bg-transparent text-slate-500 dark:text-slate-400 group-hover:bg-gray-100 dark:group-hover:bg-gray-800 transition-colors">
<span class="material-symbols-outlined text-[28px]">two_wheeler</span>
</div>
<span class="text-xs font-bold text-slate-500 dark:text-slate-400">Moto</span>
</button>
<button class="flex flex-col items-center justify-center min-w-[70px] py-2 gap-1 group opacity-60 hover:opacity-100 transition-opacity">
<div class="p-2 rounded-xl bg-transparent text-slate-500 dark:text-slate-400 group-hover:bg-gray-100 dark:group-hover:bg-gray-800 transition-colors">
<span class="material-symbols-outlined text-[28px]">local_shipping</span>
</div>
<span class="text-xs font-bold text-slate-500 dark:text-slate-400">Courier</span>
</button>
<button class="flex flex-col items-center justify-center min-w-[70px] py-2 gap-1 group opacity-60 hover:opacity-100 transition-opacity">
<div class="p-2 rounded-xl bg-transparent text-slate-500 dark:text-slate-400 group-hover:bg-gray-100 dark:group-hover:bg-gray-800 transition-colors">
<span class="material-symbols-outlined text-[28px]">airport_shuttle</span>
</div>
<span class="text-xs font-bold text-slate-500 dark:text-slate-400">Freight</span>
</button>
<button class="flex flex-col items-center justify-center min-w-[70px] py-2 gap-1 group opacity-60 hover:opacity-100 transition-opacity">
<div class="p-2 rounded-xl bg-transparent text-slate-500 dark:text-slate-400 group-hover:bg-gray-100 dark:group-hover:bg-gray-800 transition-colors">
<span class="material-symbols-outlined text-[28px]">map</span>
</div>
<span class="text-xs font-bold text-slate-500 dark:text-slate-400">Intercity</span>
</button>
</div>
</div>
<!-- Main Input Form -->
<div class="p-5 flex flex-col gap-4">
<!-- Location Inputs Group -->
<div class="relative flex flex-col gap-3">
<!-- Vertical Dotted Line Connector -->
<div class="absolute left-[19px] top-[24px] bottom-[24px] w-0.5 border-l-2 border-dashed border-gray-300 dark:border-gray-600 z-0"></div>
<!-- Pickup Input -->
<div class="relative z-10 group">
<div class="absolute left-3 top-1/2 -translate-y-1/2 text-blue-500 bg-white dark:bg-surface-dark rounded-full p-0.5">
<span class="material-symbols-outlined text-[20px] fill-current">radio_button_checked</span>
</div>
<input class="w-full bg-gray-100 dark:bg-[#25362b] border-none rounded-xl py-3.5 pl-12 pr-4 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 font-medium focus:ring-2 focus:ring-primary/50 transition-all text-sm truncate" placeholder="Pickup location" type="text" value="My Current Location"/>
</div>
<!-- Dropoff Input -->
<div class="relative z-10 group">
<div class="absolute left-3 top-1/2 -translate-y-1/2 text-primary bg-white dark:bg-surface-dark rounded-full p-0.5">
<span class="material-symbols-outlined text-[20px]">location_on</span>
</div>
<input class="w-full bg-gray-100 dark:bg-[#25362b] border-none rounded-xl py-3.5 pl-12 pr-4 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 font-medium focus:ring-2 focus:ring-primary/50 transition-all text-sm" placeholder="Where to?" type="text"/>
</div>
</div>
<!-- Fare Offer & Comments -->
<div class="flex gap-3 mt-1">
<!-- Offer Input -->
<div class="flex-1 flex flex-col">
<label class="text-[11px] uppercase font-bold text-slate-500 dark:text-slate-400 mb-1 ml-1 tracking-wider">Your Offer</label>
<div class="relative flex items-center">
<div class="absolute left-3 text-slate-400 dark:text-slate-500 pointer-events-none font-bold">$</div>
<input class="w-full bg-white dark:bg-background-dark border-2 border-primary/30 rounded-xl py-3 pl-8 pr-16 text-xl font-bold text-slate-900 dark:text-white focus:border-primary focus:ring-0 transition-colors" placeholder="0" type="number" value="15"/>
<div class="absolute right-3">
<span class="bg-primary/10 text-primary-dark dark:text-primary text-[10px] font-bold px-2 py-1 rounded">USD</span>
</div>
</div>
<p class="text-[11px] text-slate-400 dark:text-slate-500 mt-1 ml-1">Recommended: $12-16</p>
</div>
<!-- Options Button -->
<div class="flex flex-col w-1/3">
<label class="text-[11px] uppercase font-bold text-slate-500 dark:text-slate-400 mb-1 ml-1 tracking-wider">Options</label>
<button class="h-[54px] w-full flex items-center justify-center bg-gray-100 dark:bg-[#25362b] rounded-xl text-slate-600 dark:text-slate-300 hover:bg-gray-200 dark:hover:bg-[#2f4236] transition-colors">
<span class="material-symbols-outlined text-2xl">tune</span>
<span class="ml-2 text-sm font-semibold hidden @[350px]:inline">More</span>
</button>
</div>
</div>
<!-- Main Action Button -->
<button class="w-full bg-primary hover:bg-[#0fd650] active:scale-[0.98] transition-all rounded-xl py-4 flex items-center justify-center shadow-lg shadow-primary/20 mt-2">
<span class="text-slate-900 text-lg font-extrabold tracking-wide">Find a driver</span>
</button>
</div>
<!-- Safe Area Spacer for iPhone Home Bar -->
<div class="h-6 w-full bg-background-light dark:bg-surface-dark"></div>
</div>
</div>
</body></html>
