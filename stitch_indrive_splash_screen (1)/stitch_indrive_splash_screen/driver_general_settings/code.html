<!DOCTYPE html>

<style>

        .toggle-checkbox:checked {
            right: 0;
            border-color: #13ec5b;
        }
        .toggle-checkbox:checked + .toggle-label {

            width: 0px;

        }

<button class="text-text-light dark:text-text-dark flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">

<div class="flex items-center gap-3 overflow-hidden">
<span class="material-symbols-outlined text-primary">near_me</span>
<p class="text-text-light dark:text-text-dark text-base font-medium leading-normal flex-1 truncate">Default Navigation App</p>
</div>
<div class="shrink-0 flex items-center gap-2">
<p class="text-text-secondary-light dark:text-text-secondary-dark text-sm font-normal leading-normal">Google Maps</p>

</div>
</button>
<div class="h-[1px] bg-divider-light dark:bg-divider-dark mx-4"></div>

<div class="shrink-0">
<label class="relative inline-flex items-center cursor-pointer">

<div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-primary/20 dark:peer-focus:ring-primary/40 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-primary"></div>

</div>

<div class="shrink-0 flex items-center gap-2">

<div class="h-[1px] bg-divider-light dark:bg-divider-dark mx-4"></div>

<div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-primary"></div>
</label>
</div>
</div>
</div>
</div>

<div class="bg-surface-light dark:bg-surface-dark mx-4 rounded-xl shadow-sm border border-divider-light/50 dark:border-divider-dark overflow-hidden">
<!-- Night Mode -->
<button class="w-full flex items-center gap-4 px-4 min-h-[56px] justify-between hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary">dark_mode</span>
<p class="text-text-light dark:text-text-dark text-base font-medium leading-normal flex-1 truncate">Night Mode</p>
</div>
<div class="shrink-0 flex items-center gap-2">
<p class="text-text-secondary-light dark:text-text-secondary-dark text-sm font-normal leading-normal">System Default</p>
<span class="material-symbols-outlined text-text-secondary-light dark:text-text-secondary-dark text-[20px]">chevron_right</span>
</div>
</button>
<div class="h-[1px] bg-divider-light dark:bg-divider-dark mx-4"></div>
<!-- Keep Screen On -->

<p class="text-text-light dark:text-text-dark text-base font-medium leading-normal">Keep Screen On</p>

<div class="shrink-0">
<label class="relative inline-flex items-center cursor-pointer">

</div>
</div>
</div>

</div>
<div class="shrink-0">
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-primary"></div>
</label>
</div>
</div>
<div class="h-[1px] bg-divider-light dark:bg-divider-dark mx-4"></div>

<button class="w-full flex items-center gap-4 px-4 min-h-[56px] justify-between hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-red-500">delete</span>
<p class="text-red-500 text-base font-medium leading-normal flex-1 text-left">Clear App Cache</p>
</div>
<p class="text-text-secondary-light dark:text-text-secondary-dark text-xs font-normal">45 MB</p>
</button>
</div>
</div>
<!-- Reset Defaults Action -->
<div class="mx-4 mb-8">
<button class="w-full py-3 rounded-xl bg-transparent border-2 border-divider-light dark:border-divider-dark text-text-secondary-light dark:text-text-secondary-dark font-semibold text-sm hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
                    Reset all settings to default
                </button>
</div>
</div>
</div>
