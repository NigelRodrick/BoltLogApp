<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>OTP Verification</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec13",
                        "primary-dark": "#0ebf0e",
                        "background-light": "#ffffff",
                        "background-dark": "#102210",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "md": "0.375rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        
        /* Remove arrows/spinners from number input */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased transition-colors duration-200">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-hidden max-w-md mx-auto shadow-2xl bg-background-light dark:bg-background-dark">
<!-- Top App Bar -->
<header class="flex items-center justify-between px-4 py-4 pt-8 bg-transparent">
<button class="group flex items-center justify-center p-2 rounded-full hover:bg-gray-100 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-gray-900 dark:text-white text-2xl group-hover:-translate-x-1 transition-transform">arrow_back</span>
</button>
<div class="w-8"></div> <!-- Spacer for balance -->
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col px-6 pt-4">
<!-- Headline -->
<div class="mb-2 text-center">
<h1 class="text-3xl font-bold text-gray-900 dark:text-white tracking-tight">
                    Enter confirmation code
                </h1>
</div>
<!-- Body Text -->
<div class="mb-10 text-center">
<p class="text-base text-gray-500 dark:text-gray-400 leading-relaxed">
                    Enter the 4-digit code sent to <br/>
<span class="font-semibold text-gray-900 dark:text-gray-200 whitespace-nowrap">+1 (555) 000-0000</span> via SMS.
                </p>
</div>
<!-- Confirmation Code Inputs -->
<div class="mb-8">
<fieldset class="flex justify-center gap-4">
<!-- Input 1 (Active/Filled) -->
<input autofocus="" class="w-14 h-16 rounded-xl border-2 border-primary bg-transparent text-center text-3xl font-semibold text-gray-900 dark:text-white focus:outline-none focus:ring-0 focus:border-primary transition-all caret-primary shadow-[0_0_15px_rgba(19,236,19,0.2)]" maxlength="1" type="number" value="5"/>
<!-- Input 2 (Empty) -->
<input class="w-14 h-16 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/50 text-center text-3xl font-semibold text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all caret-primary" maxlength="1" type="number"/>
<!-- Input 3 (Empty) -->
<input class="w-14 h-16 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/50 text-center text-3xl font-semibold text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all caret-primary" maxlength="1" type="number"/>
<!-- Input 4 (Empty) -->
<input class="w-14 h-16 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/50 text-center text-3xl font-semibold text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all caret-primary" maxlength="1" type="number"/>
</fieldset>
</div>
<!-- Timer & Resend -->
<div class="flex flex-col items-center gap-3">
<div class="flex items-center gap-2 px-4 py-2 rounded-full bg-gray-50 dark:bg-gray-800/50 border border-gray-100 dark:border-gray-700">
<span class="material-symbols-outlined text-gray-400 text-[18px]">timer</span>
<p class="text-sm font-medium text-gray-600 dark:text-gray-300">
                        Resend code in <span class="text-gray-900 dark:text-white font-bold tabular-nums">00:24</span>
</p>
</div>
<button class="text-sm font-semibold text-gray-400 cursor-not-allowed hover:text-gray-500 dark:text-gray-600 transition-colors mt-2" disabled="">
                    Resend Code
                </button>
</div>
<!-- Spacer to push content up on larger screens, or fit nicely on mobile -->
<div class="flex-grow"></div>
<!-- Action Button -->
<div class="mb-6 mt-8">
<button class="w-full bg-primary hover:bg-primary-dark text-black font-bold text-lg py-4 rounded-xl shadow-lg shadow-primary/20 transition-all active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed">
                    Verify
                </button>
</div>
<!-- Virtual Keyboard Placeholder (Optional visual hint of keyboard presence) -->
<!-- In a real mobile view, the keyboard would push this content up. 
                 Since this is a design showcase, we show the full uncluttered UI. -->
</main>
</div>
<!-- Script to simulate basic focus movement for demonstration -->
<script>
        const inputs = document.querySelectorAll('input[type="number"]');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length > 1) {
                    e.target.value = e.target.value.slice(0, 1);
                }
                if (e.target.value.length === 1) {
                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                }
            });
            
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value) {
                    if (index > 0) {
                        inputs[index - 1].focus();
                    }
                }
            });
        });
    </script>
</body></html>
