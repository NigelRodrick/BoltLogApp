<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>New Ride Request</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1c3022",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#0d1b12] dark:text-white min-h-screen flex flex-col overflow-hidden">
<!-- Header & Timer Section -->
<header class="pt-4 px-4 pb-2 z-10 bg-background-light dark:bg-background-dark">
<div class="flex items-center justify-between mb-3">
<h2 class="text-xl font-bold leading-tight tracking-tight">New Request</h2>
<button class="flex items-center justify-center w-10 h-10 rounded-full bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors">
<span class="material-symbols-outlined text-gray-600 dark:text-gray-300">close</span>
</button>
</div>
<!-- Urgency Bar -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center text-sm font-medium text-gray-600 dark:text-gray-400">
<span>Accept quickly</span>
<span class="text-red-500 font-bold">15s</span>
</div>
<div class="h-1.5 w-full bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden">
<div class="h-full bg-primary w-[75%] rounded-full shadow-[0_0_10px_#13ec5b]"></div>
</div>
</div>
</header>
<!-- Main Content Scroll Area -->
<main class="flex-1 overflow-y-auto flex flex-col pb-4">
<!-- Map Preview -->
<div class="px-4 py-2 shrink-0">
<div class="relative w-full aspect-[2/1] rounded-2xl overflow-hidden shadow-sm border border-gray-100 dark:border-gray-800">
<div class="absolute inset-0 bg-cover bg-center" data-alt="Map showing route path from city center to airport with traffic lines" data-location="San Francisco" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBJy0PuClWWNeyBwON58rmi2SGa97cmySWbtFLGBZsU5ht1ushSh7svjvc1KjXPI9KH8utBrOuHbfa798GsoCwAdn_0-wk_Xtyh88lmRCRObwyS1JEheRDWaTD8x3gvc7zztcxUUDZD92270aqCUuEB6Kl_JmO6nglcZ0FjjJV4sLDBoM6uyzVAD7Q3HnVGikLCbluOet5Br52GYk6YMcTNhJJIHFygMzLJJ6sKGqHTTQzhrwG-EY7O-rwk8VAje7y_ZmO8crtfmuk");'>
</div>
<!-- Map Overlay Gradient -->
<div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
<!-- Distance Badge on Map -->
<div class="absolute bottom-3 left-3 bg-white/90 dark:bg-black/80 backdrop-blur-md px-3 py-1.5 rounded-lg flex items-center gap-2 shadow-lg">
<span class="material-symbols-outlined text-primary text-[20px]">near_me</span>
<span class="text-xs font-bold text-black dark:text-white">2.5 km away</span>
</div>
<div class="absolute bottom-3 right-3 bg-white/90 dark:bg-black/80 backdrop-blur-md px-3 py-1.5 rounded-lg shadow-lg">
<span class="text-xs font-bold text-black dark:text-white">Total: 15 km</span>
</div>
</div>
</div>
<!-- Details Card -->
<div class="flex flex-col px-4 pt-2 gap-4 flex-1">
<!-- Route Timeline -->
<div class="bg-surface-light dark:bg-surface-dark p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-800">
<div class="flex gap-4">
<!-- Timeline Visual -->
<div class="flex flex-col items-center pt-1">
<div class="w-3 h-3 rounded-full border-2 border-gray-400 dark:border-gray-500 bg-transparent shrink-0"></div>
<div class="w-0.5 h-full min-h-[40px] bg-gray-200 dark:bg-gray-700 my-1 rounded-full"></div>
<div class="w-3 h-3 rounded-sm bg-primary shrink-0"></div>
</div>
<!-- Route Text -->
<div class="flex flex-col justify-between w-full gap-6">
<!-- Pickup -->
<div>
<div class="flex justify-between items-start">
<h3 class="font-semibold text-lg leading-tight text-gray-900 dark:text-gray-100">124 Main Street</h3>
<span class="text-xs font-medium text-gray-500 bg-gray-100 dark:bg-gray-800 px-2 py-0.5 rounded">2 min</span>
</div>
<p class="text-sm text-gray-500 dark:text-gray-400 mt-0.5">Downtown, near Central Park</p>
</div>
<!-- Dropoff -->
<div>
<h3 class="font-semibold text-lg leading-tight text-gray-900 dark:text-gray-100">Terminal 4, City Airport</h3>
<p class="text-sm text-gray-500 dark:text-gray-400 mt-0.5">International Departures</p>
</div>
</div>
</div>
</div>
<!-- Passenger Info -->
<div class="flex items-center gap-3 p-3 bg-surface-light dark:bg-surface-dark rounded-xl border border-gray-100 dark:border-gray-800">
<div class="relative">
<div class="w-12 h-12 rounded-full bg-gray-200 dark:bg-gray-700 bg-cover bg-center" data-alt="Portrait of passenger Alex M smiling" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDrnspg-_i3VF0nxjYzx85J2Q0rXvcbEyDkQRrL95j3IGmYm_aWbUpDuQ13PS-c3xKG_DBk1yql8kFUBXKzvdv4-leq_Cti_no4GLEeeUC9bFi0sRXz3kss8easX0q1BM9eceEp22X5VC6OsxvrdFmK8XqBOJf9EJ_6DKoKF8ku-VOuZI5m13GtT-6DbtZ7_FKvAwlj4WahhmZSWE2yAF1Uu7s7CPNIFHZfc7h80284R83xutVcY3oYxQY7uN298t0CRiJenmTPOd0");'></div>
<div class="absolute -bottom-1 -right-1 bg-white dark:bg-black rounded-full p-0.5">
<span class="material-symbols-outlined text-[16px] text-blue-500 bg-blue-100 rounded-full p-0.5">verified</span>
</div>
</div>
<div class="flex-1">
<h4 class="font-bold text-gray-900 dark:text-white">Alex M.</h4>
<div class="flex items-center gap-1 text-xs text-gray-500 dark:text-gray-400">
<span class="material-symbols-outlined text-[14px] text-yellow-500 fill-current">star</span>
<span class="font-semibold text-gray-700 dark:text-gray-300">4.8</span>
<span>•</span>
<span>500+ rides</span>
</div>
</div>
<div class="flex items-center justify-center w-10 h-10 rounded-full bg-gray-50 dark:bg-gray-800 text-gray-600 dark:text-gray-300">
<span class="material-symbols-outlined">chat</span>
</div>
</div>
<!-- Fare & Negotiation Section -->
<div class="mt-2 text-center">
<p class="text-sm font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1">Offered Fare</p>
<div class="flex items-center justify-center gap-1 text-[#0d1b12] dark:text-white">
<h1 class="text-[40px] font-extrabold leading-none tracking-tight">$24.50</h1>
</div>
</div>
<!-- Counter Offers -->
<div class="flex gap-2 justify-center flex-wrap">
<button class="flex items-center justify-center gap-1 px-4 py-2.5 rounded-lg bg-surface-light dark:bg-surface-dark border border-gray-200 dark:border-gray-700 active:scale-95 transition-transform hover:border-primary/50">
<span class="text-sm font-bold text-gray-900 dark:text-white">Offer $27</span>
</button>
<button class="flex items-center justify-center gap-1 px-4 py-2.5 rounded-lg bg-surface-light dark:bg-surface-dark border border-gray-200 dark:border-gray-700 active:scale-95 transition-transform hover:border-primary/50">
<span class="text-sm font-bold text-gray-900 dark:text-white">Offer $30</span>
</button>
<button class="flex items-center justify-center gap-1 px-4 py-2.5 rounded-lg bg-surface-light dark:bg-surface-dark border border-gray-200 dark:border-gray-700 active:scale-95 transition-transform hover:border-primary/50">
<span class="text-sm font-bold text-gray-900 dark:text-white">Other</span>
</button>
</div>
</div>
</main>
<!-- Footer Actions -->
<footer class="p-4 pt-2 bg-background-light dark:bg-background-dark pb-6">
<div class="flex gap-3 h-14">
<button class="aspect-square h-full flex items-center justify-center rounded-xl bg-gray-200 dark:bg-gray-800 text-gray-600 dark:text-gray-400 font-bold hover:bg-gray-300 dark:hover:bg-gray-700 transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
<button class="flex-1 h-full rounded-xl bg-primary text-[#0d1b12] font-extrabold text-lg tracking-wide hover:bg-[#0fd650] active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-lg shadow-primary/25">
<span>ACCEPT REQUEST</span>
<span class="bg-black/10 px-2 py-0.5 rounded text-sm font-bold backdrop-blur-sm">15s</span>
</button>
</div>
</footer>
</body></html>
