<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>InDrive Ride Tracking</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1a2c20",
                        "text-main": "#0d1b12",
                        "text-secondary": "#4c9a66",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.5rem", "lg": "0.75rem", "xl": "1rem", "full": "9999px" },
                    boxShadow: {
                        "soft": "0 4px 20px -2px rgba(0, 0, 0, 0.1)",
                        "up": "0 -4px 20px -2px rgba(0, 0, 0, 0.1)"
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Hide scrollbar for clean UI */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-text-main antialiased overflow-hidden h-screen w-screen relative">
<!-- Full Screen Map Background -->
<div class="absolute inset-0 z-0 h-full w-full bg-cover bg-center" data-alt="Map showing city streets with a route line and car icon" data-location="New York City" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDSF9nz-JPJZNr-lOoyZaxStsO1U3Mn09UT9lzlcP4tHVF9FW37AaO7mOjm37dUKhI04lUkro8qjTl_lCrgE55jzazUCpHzDc1CYC5XZyAzX3aP0xN0fybZPl0toXar5wniAldx1wHNmW_qZ2rcPeK4m6GGVeffAo1zs1H7_flkIb8r8ghbi_Pyer-t7Fw9dm9HjiOLZHT2Kke07EJfcBSac8ukR0V34dx0yXJE_qxm7lDIKfLvt0dt7OjRogmvZx81fg3-EAXWLP0"); filter: brightness(1.1) contrast(0.9);'>
<!-- Fake Map Elements for realism -->
<div class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2">
<!-- Car Marker -->
<div class="relative flex items-center justify-center">
<div class="w-16 h-16 bg-primary/20 rounded-full animate-ping absolute"></div>
<div class="w-10 h-10 bg-surface-light rounded-full shadow-lg flex items-center justify-center relative z-10 border-2 border-primary rotate-45">
<span class="material-symbols-outlined text-primary" style="font-size: 24px;">directions_car</span>
</div>
<!-- Tooltip -->
<div class="absolute -top-12 bg-surface-light dark:bg-surface-dark px-3 py-1 rounded shadow-md whitespace-nowrap">
<p class="text-xs font-bold text-text-main dark:text-white">5 min away</p>
<div class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-2 h-2 bg-surface-light dark:bg-surface-dark rotate-45"></div>
</div>
</div>
</div>
<!-- Destination Pin (Bottom Rightish) -->
<div class="absolute bottom-1/3 right-8">
<span class="material-symbols-outlined text-red-500 drop-shadow-md icon-filled" style="font-size: 40px;">location_on</span>
</div>
</div>
<!-- Overlay UI Container -->
<div class="relative z-10 flex flex-col h-full pointer-events-none">
<!-- Top App Bar (Transparent) -->
<div class="pointer-events-auto pt-12 px-4 pb-4 flex items-center justify-between bg-gradient-to-b from-white/80 to-transparent dark:from-black/50">
<button class="bg-surface-light dark:bg-surface-dark/90 shadow-md h-10 w-10 rounded-full flex items-center justify-center hover:bg-gray-50 transition-colors">
<span class="material-symbols-outlined text-text-main dark:text-white">arrow_back</span>
</button>
<div class="bg-surface-light dark:bg-surface-dark/90 px-4 py-2 rounded-full shadow-md flex items-center gap-2">
<span class="w-2 h-2 bg-primary rounded-full animate-pulse"></span>
<span class="text-sm font-bold text-text-main dark:text-white">Arriving in 5 min</span>
</div>
<button class="bg-surface-light dark:bg-surface-dark/90 shadow-md h-10 w-10 rounded-full flex items-center justify-center hover:bg-gray-50 text-blue-600 transition-colors">
<span class="material-symbols-outlined icon-filled">local_police</span>
</button>
</div>
<!-- Spacer to push content down -->
<div class="flex-1 relative">
<!-- Map Controls (Zoom/Location) -->
<div class="absolute right-4 bottom-4 flex flex-col gap-3 pointer-events-auto">
<button class="h-10 w-10 bg-surface-light dark:bg-surface-dark shadow-md rounded flex items-center justify-center text-text-main dark:text-white hover:bg-gray-50">
<span class="material-symbols-outlined">add</span>
</button>
<button class="h-10 w-10 bg-surface-light dark:bg-surface-dark shadow-md rounded flex items-center justify-center text-text-main dark:text-white hover:bg-gray-50">
<span class="material-symbols-outlined">remove</span>
</button>
<button class="h-10 w-10 bg-surface-light dark:bg-surface-dark shadow-md rounded flex items-center justify-center text-primary hover:bg-gray-50 mt-2">
<span class="material-symbols-outlined">my_location</span>
</button>
</div>
</div>
<!-- Bottom Sheet Panel -->
<div class="pointer-events-auto bg-surface-light dark:bg-surface-dark rounded-t-xl shadow-up pb-6">
<!-- Handle -->
<div class="flex justify-center pt-3 pb-1 w-full">
<div class="h-1.5 w-12 rounded-full bg-gray-200 dark:bg-gray-700"></div>
</div>
<!-- Driver & Car Info Header -->
<div class="px-5 pt-2 pb-4 border-b border-gray-100 dark:border-gray-800">
<div class="flex justify-between items-start">
<div class="flex-1">
<h2 class="text-2xl font-bold text-text-main dark:text-white tracking-tight">Toyota Camry</h2>
<div class="flex items-center gap-2 mt-1">
<span class="bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 px-2 py-0.5 rounded text-sm font-medium">White</span>
<span class="bg-gray-100 dark:bg-gray-800 text-text-main dark:text-white px-2 py-0.5 rounded text-sm font-bold border border-gray-200 dark:border-gray-700">ABC-1234</span>
</div>
</div>
<!-- Driver Avatar -->
<div class="relative">
<div class="h-14 w-14 rounded-full bg-cover bg-center border-2 border-white dark:border-gray-700 shadow-md" data-alt="Portrait of a smiling male driver" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCV_3jKxk_-ww7WaghRT0MNwBG67hsTkRrh5_Xr4nT1BXgLTBcGCOCnXUwCXM1dZfkoQTD7gVkhY9piJP11CHp0RsKQDudkfh5lWuhOjVzUzgkxFTrj0llgBcheCwF74gxL5wf6ORaUh_821BaRxLhyrEiP1-horlrkyECir7DOu78RUyNcD-E9GzVQsUquYbqDsDyf7Z_qjC_Q93T8_pKNZnKN7jLGcFbEOvxBEp8JaVZo7MM1sXxJ7r44VGiQqGHfJiYMGumggV0");'>
</div>
<div class="absolute -bottom-1 -right-1 bg-surface-light dark:bg-surface-dark rounded-full px-1.5 py-0.5 shadow-sm border border-gray-100 dark:border-gray-800 flex items-center gap-0.5">
<span class="material-symbols-outlined text-yellow-500 icon-filled" style="font-size: 10px;">star</span>
<span class="text-[10px] font-bold text-text-main dark:text-white">4.9</span>
</div>
</div>
</div>
<div class="flex items-center gap-2 mt-3">
<p class="text-sm font-medium text-text-secondary dark:text-gray-400">Driver: <span class="text-text-main dark:text-white font-semibold">Alex</span></p>
<span class="text-gray-300">•</span>
<p class="text-sm font-medium text-primary">On the way</p>
</div>
</div>
<!-- Ride Details Row -->
<div class="px-5 py-4 flex items-center justify-between">
<!-- Trip Route Summary -->
<div class="flex flex-col gap-3 flex-1 pr-4">
<div class="flex items-start gap-3 relative">
<!-- Route Line Graphic -->
<div class="absolute left-[7px] top-4 bottom-[-14px] w-0.5 bg-gray-200 dark:bg-gray-700 border-l border-dashed border-gray-300 dark:border-gray-600"></div>
<div class="flex-shrink-0 mt-1">
<div class="w-4 h-4 rounded-full border-[3px] border-primary bg-surface-light dark:bg-surface-dark"></div>
</div>
<div class="flex-1 min-w-0">
<p class="text-xs text-text-secondary dark:text-gray-400 uppercase font-semibold tracking-wider">Pickup</p>
<p class="text-sm font-medium text-text-main dark:text-white truncate">Grand Central Terminal</p>
</div>
</div>
<div class="flex items-start gap-3">
<div class="flex-shrink-0 mt-1">
<span class="material-symbols-outlined text-red-500" style="font-size: 16px;">location_on</span>
</div>
<div class="flex-1 min-w-0">
<p class="text-xs text-text-secondary dark:text-gray-400 uppercase font-semibold tracking-wider">Dropoff</p>
<p class="text-sm font-medium text-text-main dark:text-white truncate">1024 5th Ave, Brooklyn</p>
</div>
</div>
</div>
<!-- Price -->
<div class="flex flex-col items-end flex-shrink-0 pl-4 border-l border-gray-100 dark:border-gray-800">
<span class="text-2xl font-bold text-primary">$15.00</span>
<span class="text-xs text-text-secondary dark:text-gray-400 font-medium">Cash</span>
</div>
</div>
<!-- Action Buttons -->
<div class="px-5 pt-2 grid grid-cols-5 gap-3">
<button class="col-span-1 h-12 rounded bg-red-50 hover:bg-red-100 dark:bg-red-900/20 dark:hover:bg-red-900/30 flex flex-col items-center justify-center text-red-600 dark:text-red-400 transition-colors group">
<span class="material-symbols-outlined mb-0 group-hover:scale-110 transition-transform" style="font-size: 24px;">close</span>
</button>
<button class="col-span-2 h-12 rounded bg-primary/10 hover:bg-primary/20 dark:bg-primary/20 dark:hover:bg-primary/30 flex items-center justify-center gap-2 text-primary-dark transition-colors group">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform icon-filled">chat</span>
<span class="font-bold text-primary">Message</span>
</button>
<button class="col-span-2 h-12 rounded bg-primary hover:bg-green-400 flex items-center justify-center gap-2 text-white shadow-md shadow-primary/30 transition-all group active:scale-95">
<span class="material-symbols-outlined group-hover:rotate-12 transition-transform icon-filled">call</span>
<span class="font-bold text-black">Call</span>
</button>
</div>
<!-- Safe Area for newer iPhones -->
<div class="h-6 w-full"></div>
</div>
</div>
</body></html>
